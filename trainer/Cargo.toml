[package]
name = "bitfox-trainer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "NNUE training pipeline for the bitfox chess engine, built on Bullet"
authors = ["Azeel"]

[[bin]]
name = "train"
path = "src/train.rs"

[features]
default = ["metal"]
metal = ["bullet_lib/metal"]
cuda = ["bullet_lib/cuda"]

[dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "ae9dd186af26d4a54518df5021ecde24e3ce8dc8", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
