[package]
name = "bitfox-convert"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "Convert bitfox datagen text (fen | score | wdl) into bulletformat .data for Bullet"
authors = ["Azeel"]

[[bin]]
name = "convert"
path = "src/main.rs"

[dependencies]
bulletformat = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
