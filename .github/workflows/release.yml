name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty to use v<engine version>."
        required: false
        type: string
      publish:
        description: "Publish the release after verification. Leave disabled to build review artifacts only."
        required: false
        type: boolean
        default: false
      source_inputs_run_id:
        description: "Successful run for this commit containing the bitfox-source-inputs-<commit> artifact. Required to publish."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      source_inputs_run_id: ${{ steps.meta.outputs.source_inputs_run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          PUBLISH_RELEASE: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          SOURCE_INPUTS_RUN_ID: ${{ github.event.inputs.source_inputs_run_id || vars.BITFOX_SOURCE_INPUTS_RUN_ID || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$PUBLISH_RELEASE" == "true" && -z "$SOURCE_INPUTS_RUN_ID" ]]; then
            echo "::error::Publishing requires source_inputs_run_id or BITFOX_SOURCE_INPUTS_RUN_ID with reviewed source material for this commit"
            exit 1
          fi
          if [[ -n "$SOURCE_INPUTS_RUN_ID" ]]; then
            if [[ ! "$SOURCE_INPUTS_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::source_inputs_run_id must be a positive numeric workflow run ID"
              exit 1
            fi
            source_input_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_INPUTS_RUN_ID}" \
              --jq '.head_sha + " " + .status + " " + (.conclusion // "")')"
            if [[ "$source_input_metadata" != "${source_commit} completed success" ]]; then
              echo "::error::Source material must come from a successful completed run of the exact release commit"
              exit 1
            fi
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            git fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
              echo "::error::Release commit ${source_commit} is not on origin/main"
              exit 1
            fi
          fi

          version="$(awk -F'"' '/^version = / {print $2; exit}' engine/Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from engine/Cargo.toml"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v${version}"
          fi

          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::Release tag ${tag} does not match engine version ${version}"
            exit 1
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]] && git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$source_commit" ]]; then
              echo "::error::Release tag ${tag} points to ${tag_commit}, not ${source_commit}"
              exit 1
            fi
          fi

          python3 tools/release_metadata.py "$version" >/dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"
          echo "source_inputs_run_id=${SOURCE_INPUTS_RUN_ID}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    needs: version
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: tools

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Check release scripts
        run: |
          for script in tools/release-smoke.sh tools/package-linux-gui.sh tools/package-macos-gui.sh tools/pgo-build.sh; do
            bash -n "$script"
          done

      - name: Verify engine
        working-directory: engine
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo test --profile release-test --locked --all-targets --all-features

      - name: Verify training and strength tools
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          cargo test --locked --manifest-path trainer/convert/Cargo.toml
          cargo test --locked --manifest-path trainer/Cargo.toml --no-default-features
          cargo clippy --locked --manifest-path trainer/Cargo.toml --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --manifest-path trainer/convert/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path trainer/Cargo.toml --all -- --check
          cargo fmt --manifest-path trainer/convert/Cargo.toml --all -- --check

  engine-linux-x86_64:
    name: Engine / Linux x86_64
    runs-on: ubuntu-22.04
    needs: [version, verify]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="bitfox-${VERSION}-linux-x86_64"
          mkdir -p "dist/${pkg}"
          cp LICENSE "dist/${pkg}/LICENSE"
          cp licenses/rust-dependencies.txt "dist/${pkg}/THIRD_PARTY_NOTICES.txt"
          tools/pgo-build.sh x86-64-v2 "dist/${pkg}/bitfox"
          tools/pgo-build.sh x86-64-v3 "dist/${pkg}/bitfox-avx2"

          for bin in bitfox bitfox-avx2; do
            chmod 755 "dist/${pkg}/${bin}"
            python tools/smoke_engine.py --version "$VERSION" -- "dist/${pkg}/${bin}"
          done

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          (
            cd dist
            tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 \
              --numeric-owner -cf - "$pkg" | gzip -n > "${pkg}.tar.gz"
            sha256sum "${pkg}.tar.gz" | awk -v name="${pkg}.tar.gz" '{print $1 "  " name}' > "${pkg}.tar.gz.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-linux-x86_64
          if-no-files-found: error
          path: |
            dist/bitfox-*-linux-x86_64.tar.gz
            dist/bitfox-*-linux-x86_64.tar.gz.sha256

  engine-linux-aarch64:
    name: Engine / Linux ARM64
    runs-on: ubuntu-22.04
    needs: [version, verify]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user-static

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add --toolchain 1.96.0 aarch64-unknown-linux-gnu

      - name: Build package
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd engine && cargo build --release --locked --target aarch64-unknown-linux-gnu \
            --config "target.aarch64-unknown-linux-gnu.rustflags=[\"--remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=cargo\",\"--remap-path-prefix=${GITHUB_WORKSPACE}=bitfox\"]")
          pkg="bitfox-${VERSION}-linux-aarch64"
          mkdir -p "dist/${pkg}"
          cp LICENSE "dist/${pkg}/LICENSE"
          cp licenses/rust-dependencies.txt "dist/${pkg}/THIRD_PARTY_NOTICES.txt"
          cp engine/target/aarch64-unknown-linux-gnu/release/bitfox "dist/${pkg}/bitfox"
          chmod 755 "dist/${pkg}/bitfox"

          python tools/smoke_engine.py --version "$VERSION" -- \
            qemu-aarch64-static -L /usr/aarch64-linux-gnu "dist/${pkg}/bitfox"

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          (
            cd dist
            tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 \
              --numeric-owner -cf - "$pkg" | gzip -n > "${pkg}.tar.gz"
            sha256sum "${pkg}.tar.gz" | awk -v name="${pkg}.tar.gz" '{print $1 "  " name}' > "${pkg}.tar.gz.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-linux-aarch64
          if-no-files-found: error
          path: |
            dist/bitfox-*-linux-aarch64.tar.gz
            dist/bitfox-*-linux-aarch64.tar.gz.sha256

  engine-macos-arm64:
    name: Engine / macOS arm64
    runs-on: macos-15
    needs: [version, verify]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          pkg="bitfox-${VERSION}-macos-arm64"
          mkdir -p "dist/${pkg}"
          cp LICENSE "dist/${pkg}/LICENSE"
          cp licenses/rust-dependencies.txt "dist/${pkg}/THIRD_PARTY_NOTICES.txt"
          tools/pgo-build.sh "" "dist/${pkg}/bitfox"
          chmod 755 "dist/${pkg}/bitfox"

          python tools/smoke_engine.py --version "$VERSION" -- "dist/${pkg}/bitfox"

          minos="$(otool -l "dist/${pkg}/bitfox" | awk '$1 == "minos" {print $2; exit}')"
          if [[ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]]; then
            echo "::error::Engine deployment target is ${minos:-unknown}, expected ${MACOSX_DEPLOYMENT_TARGET}"
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          archive_time="$(date -u -r "$source_date_epoch" "+%Y%m%d%H%M.%S")"
          find "dist/${pkg}" -exec touch -h -t "$archive_time" {} +
          (
            cd dist
            COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --uname root --gname root \
              --numeric-owner -cf - "$pkg" | gzip -n > "${pkg}.tar.gz"
            shasum -a 256 "${pkg}.tar.gz" | awk -v name="${pkg}.tar.gz" '{print $1 "  " name}' > "${pkg}.tar.gz.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-macos-arm64
          if-no-files-found: error
          path: |
            dist/bitfox-*-macos-arm64.tar.gz
            dist/bitfox-*-macos-arm64.tar.gz.sha256

  engine-windows-x86_64:
    name: Engine / Windows x86_64
    runs-on: windows-2022
    needs: [version, verify]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Build engines
        shell: bash
        run: |
          set -euo pipefail
          tools/pgo-build.sh x86-64-v2 dist/engines/bitfox.exe
          tools/pgo-build.sh x86-64-v3 dist/engines/bitfox-avx2.exe

      - name: Build package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"

          $pkg = "bitfox-$version-windows-x86_64"
          $dist = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "LICENSE" "$dist/LICENSE"
          Copy-Item "licenses/rust-dependencies.txt" "$dist/THIRD_PARTY_NOTICES.txt"
          foreach ($bin in @("bitfox.exe", "bitfox-avx2.exe")) {
            Move-Item "dist/engines/$bin" "$dist/$bin"
          }
          python tools/windows_runtime.py stage --bundle "$dist" --executable "bitfox.exe" --executable "bitfox-avx2.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "App-local Windows runtime staging failed"
          }
          foreach ($bin in @("bitfox.exe", "bitfox-avx2.exe")) {
            python tools/smoke_engine.py --version "$version" -- "$dist/$bin"
            if ($LASTEXITCODE -ne 0) {
              throw "Windows engine $bin failed search smoke test"
            }
          }
          Remove-Item "dist/engines"

          $sourceEpochText = & git show -s --format=%ct $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the release source timestamp"
          }
          $sourceEpoch = [int64]$sourceEpochText
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($sourceEpoch).UtcDateTime
          Get-ChildItem -LiteralPath $dist -Recurse -Force | ForEach-Object {
            $_.LastWriteTimeUtc = $timestamp
          }
          (Get-Item -LiteralPath $dist).LastWriteTimeUtc = $timestamp
          $zip = "dist/$pkg.zip"
          Compress-Archive -Path $dist -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -NoNewline

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-windows-x86_64
          if-no-files-found: error
          path: |
            dist/bitfox-*-windows-x86_64.zip
            dist/bitfox-*-windows-x86_64.zip.sha256

  gui-linux-x86_64:
    name: GUI / Linux x86_64
    runs-on: ubuntu-22.04
    needs: [version, verify]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ninja-build \
            patchelf \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-multimedia-dev \
            qt6-qpa-plugins

      - name: Build board
        run: |
          cmake -S gui-qt -B gui-qt/build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBITFOX_STRICT_WARNINGS=ON
          cmake --build gui-qt/build-linux --parallel 2
          ctest --test-dir gui-qt/build-linux --output-on-failure

      - name: Package board
        run: tools/package-linux-gui.sh

      - name: Smoke packaged engine
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python tools/smoke_engine.py --version "$VERSION" -- "dist/Bitfox/engines/Bitfox $VERSION"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-linux-x86_64-gui
          if-no-files-found: error
          path: |
            dist/bitfox-*-linux-x86_64-gui.tar.gz
            dist/bitfox-*-linux-x86_64-gui.tar.gz.sha256

  gui-macos-arm64:
    name: GUI / macOS arm64
    runs-on: macos-15
    needs: [version, verify]
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.0"
          setup-python: false
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Build board
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S gui-qt -B gui-qt/build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DBUILD_TESTING=ON \
            -DBITFOX_STRICT_WARNINGS=ON
          cmake --build gui-qt/build-macos --parallel
          ctest --test-dir gui-qt/build-macos --output-on-failure

      - name: Package board
        run: tools/package-macos-gui.sh

      - name: Smoke packaged engine
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python tools/smoke_engine.py --version "$VERSION" -- "dist/Bitfox.app/Contents/MacOS/engines/Bitfox $VERSION"

      - name: Smoke packaged board
        run: python3 tools/smoke_gui.py dist/Bitfox.app/Contents/MacOS/bitfox-board --platform cocoa --plugin-dir dist/Bitfox.app/Contents/PlugIns

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-macos-arm64-gui
          if-no-files-found: error
          path: |
            dist/bitfox-*-macos-arm64-gui.zip
            dist/bitfox-*-macos-arm64-gui.zip.sha256

  gui-windows-x86_64:
    name: GUI / Windows x86_64
    runs-on: windows-2022
    needs: [version, verify]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python for engine smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"

      - name: Install engine smoke dependency
        run: python -m pip install chess==1.11.2

      - uses: ./.github/actions/rustup-home

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.8.3"
          setup-python: false
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Build board
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S gui-qt -B gui-qt/build-windows -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBITFOX_STRICT_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }
          cmake --build gui-qt/build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }
          ctest --test-dir gui-qt/build-windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "CTest failed with exit code $LASTEXITCODE"
          }

      - name: Package board
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          $buildDir = "gui-qt/build-windows/Release"
          $distRoot = "dist"
          $dist = "$distRoot/Bitfox"
          New-Item -ItemType Directory -Force -Path "$dist/engines" | Out-Null

          Copy-Item "LICENSE" "$dist/LICENSE"
          Copy-Item "licenses/rust-dependencies.txt" "$dist/THIRD_PARTY_NOTICES.txt"
          Copy-Item "$buildDir/bitfox-board.exe" "$dist/"
          Copy-Item "$buildDir/bitfox.dll" "$dist/"
          Copy-Item "engine/target/release/bitfox.exe" "$dist/engines/Bitfox $version.exe"

          windeployqt --release --no-compiler-runtime --no-translations --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler "$dist/bitfox-board.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          python tools/windows_runtime.py stage --bundle "$dist" --executable "bitfox-board.exe" --executable "engines/Bitfox $version.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "App-local Windows runtime staging failed"
          }

          $qtVersion = & qmake -query QT_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read deployed Qt version"
          }
          python tools/gui_dependency_notices.py official --bundle "$dist" --platform windows --qt-version "$qtVersion"
          if ($LASTEXITCODE -ne 0) {
            throw "GUI dependency notices could not be verified"
          }

          python tools/smoke_engine.py --version "$version" -- "$dist/engines/Bitfox $version.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled engine failed search smoke test"
          }

          $boardExe = (Resolve-Path "$dist/bitfox-board.exe").Path
          $boardDir = (Resolve-Path "$dist").Path
          $logId = [Guid]::NewGuid().ToString("N")
          $stdoutLog = Join-Path $env:RUNNER_TEMP "bitfox-board-$logId.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "bitfox-board-$logId.stderr.log"
          $startArgs = @{
            FilePath = $boardExe
            WorkingDirectory = $boardDir
            RedirectStandardOutput = $stdoutLog
            RedirectStandardError = $stderrLog
            PassThru = $true
          }
          $process = Start-Process @startArgs
          $smokeError = $null
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              $smokeError = "Packaged board exited early with code $($process.ExitCode)"
            } else {
              $process.Refresh()
              if ($process.MainWindowHandle -eq 0 -or !$process.Responding) {
                $smokeError = "Packaged board did not create a responding window"
              }
            }
          } finally {
            if (!$process.HasExited) {
              try {
                [void]$process.CloseMainWindow()
              } catch [System.InvalidOperationException] {
              }
              if (!$process.HasExited -and !$process.WaitForExit(5000)) {
                try {
                  Stop-Process -Id $process.Id -Force
                } catch {
                  if (!$process.HasExited) {
                    throw
                  }
                }
                if (!$process.HasExited -and !$process.WaitForExit(5000)) {
                  $smokeError = "Packaged board did not stop after a forced shutdown"
                }
              }
            }
            if ($smokeError) {
              Get-Content -LiteralPath $stdoutLog -ErrorAction SilentlyContinue | Write-Output
              Get-Content -LiteralPath $stderrLog -ErrorAction SilentlyContinue | ForEach-Object {
                [Console]::Error.WriteLine($_)
              }
            }
            Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
          }
          if ($smokeError) {
            throw $smokeError
          }

          python tools/gui_dependency_notices.py verify --bundle "$dist"
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged GUI dependency manifest verification failed"
          }

          $sourceEpochText = & git show -s --format=%ct $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the release source timestamp"
          }
          $sourceEpoch = [int64]$sourceEpochText
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($sourceEpoch).UtcDateTime
          Get-ChildItem -LiteralPath $dist -Recurse -Force | ForEach-Object {
            $_.LastWriteTimeUtc = $timestamp
          }
          (Get-Item -LiteralPath $dist).LastWriteTimeUtc = $timestamp
          $zip = "$distRoot/bitfox-$version-windows-x86_64-gui.zip"
          Compress-Archive -Path "$dist" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -NoNewline

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-windows-x86_64-gui
          if-no-files-found: error
          path: |
            dist/bitfox-*-windows-x86_64-gui.zip
            dist/bitfox-*-windows-x86_64-gui.zip.sha256

  corresponding-source:
    name: Bind corresponding source to binary packages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    needs:
      - version
      - verify
      - engine-linux-x86_64
      - engine-linux-aarch64
      - engine-macos-arm64
      - engine-windows-x86_64
      - gui-linux-x86_64
      - gui-macos-arm64
      - gui-windows-x86_64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download binary packages
        if: ${{ needs.version.outputs.source_inputs_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Download reviewed source material
        if: ${{ needs.version.outputs.source_inputs_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bitfox-source-inputs-${{ needs.version.outputs.source_commit }}
          path: source-inputs
          run-id: ${{ needs.version.outputs.source_inputs_run_id }}
          github-token: ${{ github.token }}

      - name: Create and verify corresponding source bundle
        if: ${{ needs.version.outputs.source_inputs_run_id != '' }}
        run: |
          set -euo pipefail
          test -s source-inputs/plan.json
          test -d source-inputs/payload
          archive="release-assets/bitfox-${VERSION}-corresponding-source.tar.gz"
          python3 tools/source_bundle.py create "$VERSION" --packages release-assets \
            --commit "$SOURCE_COMMIT" --plan source-inputs/plan.json \
            --root source-inputs --archive "$archive"
          python3 tools/source_bundle.py verify "$VERSION" --packages release-assets \
            --commit "$SOURCE_COMMIT" --archive "$archive"
          python3 tools/release_metadata.py "$VERSION" --directory release-assets \
            --require-source --source-commit "$SOURCE_COMMIT"

      - name: Upload corresponding source bundle
        if: ${{ needs.version.outputs.source_inputs_run_id != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-corresponding-source
          if-no-files-found: error
          path: |
            release-assets/bitfox-*-corresponding-source.tar.gz
            release-assets/bitfox-*-corresponding-source.tar.gz.sha256

  smoke-artifacts:
    name: Smoke release artifacts
    runs-on: ubuntu-22.04
    needs:
      - version
      - engine-linux-x86_64
      - engine-linux-aarch64
      - engine-macos-arm64
      - engine-windows-x86_64
      - gui-linux-x86_64
      - gui-macos-arm64
      - gui-windows-x86_64
      - corresponding-source

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Smoke test artifacts
        env:
          ASSET_DIR: ${{ github.workspace }}/release-assets
        run: tools/release-smoke.sh "${{ needs.version.outputs.tag }}"

      - name: Verify assets and prepare updater checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 tools/release_metadata.py "$VERSION" --directory release-assets

      - name: Upload review artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-review-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: release-assets/
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - version
      - smoke-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Verify assets and prepare updater checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 tools/release_metadata.py "$VERSION" --directory release-assets \
            --require-source --source-commit "$SOURCE_COMMIT"

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 == "## [" version "]" {show=1; next}
            show && /^## \[/ {exit}
            show {print}
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            printf "Bitfox %s\n" "$VERSION" > release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name "bitfox-${VERSION}-*" -o -name SHA256SUMS \) | sort)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "bitfox-${VERSION}-*" --pattern SHA256SUMS \
              --dir "$existing_dir"
            mapfile -t existing < <(find "$existing_dir" -type f | sort)
            if [[ "${#existing[@]}" -ne "${#assets[@]}" ]]; then
              echo "::error::Existing release has a different asset count"
              exit 1
            fi
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if [[ ! -f "$existing_dir/$name" ]] || ! cmp -s "$asset" "$existing_dir/$name"; then
                echo "::error::Existing release asset differs: ${name}"
                exit 1
              fi
            done
            echo "Release ${TAG} already contains the exact immutable assets"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Bitfox ${VERSION}" \
              --notes-file release-notes.md
          fi

  smoke-release:
    name: Smoke release
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-22.04
    needs:
      - version
      - publish

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Smoke test release
        run: tools/release-smoke.sh "${{ needs.version.outputs.tag }}"
