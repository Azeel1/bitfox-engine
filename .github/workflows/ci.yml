name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Build release
        working-directory: engine
        run: cargo build --release --locked

      - name: Test
        working-directory: engine
        run: cargo test --locked --all-targets --all-features

      - name: Test release
        working-directory: engine
        run: cargo test --profile release-test --locked --all-targets --all-features

      - name: Build datagen profile
        working-directory: engine
        run: cargo build --profile datagen --locked

      - name: Bench
        working-directory: engine
        run: cargo run --release --locked -- bench

      - name: Network guard tests
        working-directory: engine
        shell: bash
        run: |
          rustc --edition 2021 --test build.rs -o target/guard-tests.exe
          ./target/guard-tests.exe

      - name: Clippy
        working-directory: engine
        run: cargo clippy --release --locked --all-targets --all-features -- -D warnings

      - name: Format
        working-directory: engine
        run: cargo fmt --check

  tooling:
    name: Training and strength tools
    runs-on: ubuntu-22.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: tools

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Test Python tools
        shell: python
        run: |
          import unittest
          suite = unittest.defaultTestLoader.discover("tools", pattern="test_*.py")
          if suite.countTestCases() == 0:
              raise SystemExit("No Python tool tests were discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)

      - name: Test data converter
        run: cargo test --locked --manifest-path trainer/convert/Cargo.toml

      - name: Test trainer
        run: cargo test --locked --manifest-path trainer/Cargo.toml --no-default-features

      - name: Clippy training tools
        run: |
          cargo clippy --locked --manifest-path trainer/Cargo.toml --no-default-features --all-targets -- -D warnings
          cargo clippy --locked --manifest-path trainer/convert/Cargo.toml --all-targets -- -D warnings

      - name: Format training tools
        run: |
          cargo fmt --manifest-path trainer/Cargo.toml --all -- --check
          cargo fmt --manifest-path trainer/convert/Cargo.toml --all -- --check
