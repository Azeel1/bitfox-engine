name: Linux GUI Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-gui:
    name: Linux GUI / x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ninja-build \
            patchelf \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-multimedia-dev \
            qt6-qpa-plugins

      - name: Build board
        run: |
          cmake -S gui-qt -B gui-qt/build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBITFOX_STRICT_WARNINGS=ON
          cmake --build gui-qt/build-linux --parallel 2
          ctest --test-dir gui-qt/build-linux --output-on-failure

      - name: Package board
        run: tools/package-linux-gui.sh

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitfox-linux-x86_64-gui
          if-no-files-found: error
          path: |
            dist/bitfox-*-linux-x86_64-gui.tar.gz
            dist/bitfox-*-linux-x86_64-gui.tar.gz.sha256
